<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eideus Dawn</title>
<style>
      @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600&family=VT323&display=swap');

      body {
        font-family: 'Rajdhani', sans-serif;
        background-color: #000000;
        color: #a3a3a3;
        overflow: hidden;
      }

      /* --- THEME UTILS --- */
      
      /* 3D Glass Panel Effect */
      .glass-panel-3d {
        background: rgba(15, 15, 20, 0.6);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.05);
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        border-bottom: 2px solid rgba(0, 0, 0, 0.8);
        box-shadow: 
          0 20px 50px rgba(0,0,0,0.9),
          inset 0 1px 0 rgba(255,255,255,0.05),
          inset 0 0 40px rgba(0,0,0,0.5);
      }

      /* CRT Screen Container */
      .crt-screen {
        position: relative;
        background: #050505;
        overflow: hidden;
        box-shadow: inset 0 0 100px rgba(0,0,0,0.9);
      }
      
      /* Scanlines & Flicker */
      .crt-screen::before {
        content: " ";
        display: block;
        position: absolute;
        top: 0; left: 0; bottom: 0; right: 0;
        background: 
          linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
          linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
        background-size: 100% 2px, 3px 100%;
        z-index: 5;
        pointer-events: none;
      }

      .crt-screen::after {
        content: " ";
        display: block;
        position: absolute;
        top: 0; left: 0; bottom: 0; right: 0;
        background: rgba(18, 16, 16, 0.1);
        opacity: 0;
        z-index: 5;
        pointer-events: none;
        animation: flicker 0.15s infinite;
      }

      @keyframes flicker {
        0% { opacity: 0.01; }
        50% { opacity: 0.05; }
        100% { opacity: 0.01; }
      }

      /* Text Glow for Noir Feel */
      .noir-text-glow {
        text-shadow: 0 0 2px currentColor;
      }

      /* --- RIPPLE & BACKGROUND EFFECTS --- */
      .bg-void-container {
        position: absolute;
        inset: 0;
        overflow: hidden;
        /* Removed opaque background to show Starfield */
        background: transparent; 
        z-index: 1; /* Above stars, below content */
        pointer-events: none;
        /* Default CSS Variables if not set inline */
        --ripple-x: 50%;
        --ripple-y: 50%;
      }

      .ripple-wave {
        position: absolute;
        top: var(--ripple-y);
        left: var(--ripple-x);
        transform: translate(-50%, -50%);
        border: 2px solid rgba(6, 182, 212, 0.4);
        box-shadow: 
            0 0 40px rgba(6, 182, 212, 0.2),
            inset 0 0 20px rgba(6, 182, 212, 0.1);
        opacity: 0;
        /* Refract Animation: Expands to wall, bounces back to center */
        animation: ripple-refract 12s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
      }

      /* Staggered delays for seamless loop of multiple waves */
      .ripple-wave:nth-child(1) { animation-delay: -4s; }
      .ripple-wave:nth-child(2) { animation-delay: -8s; }
      .ripple-wave:nth-child(3) { animation-delay: 0s; }

      @keyframes ripple-refract {
        0% {
          width: 0;
          height: 0;
          border-radius: 50%;
          border-width: 4px;
          opacity: 0;
        }
        10% {
          opacity: 0.5;
        }
        45% {
          /* Approaching edge: still mostly circular */
          width: 95vmin; /* Use vmin to stay contained within shortest side initially */
          height: 95vmin;
          border-radius: 50%;
          border-width: 2px;
          opacity: 0.4;
          border-color: rgba(6, 182, 212, 0.4);
        }
        50% {
          /* HIT THE WALL: Impact */
          /* Expands well beyond viewport to simulate filling the corners */
          width: 150vmax; 
          height: 150vmax;
          /* Deform to "fill" rectangle (visually approximated by going huge and reducing radius) */
          border-radius: 20%; 
          border-width: 8px; /* Impact flare */
          opacity: 0.1; /* Diffuse energy upon impact */
          border-color: rgba(200, 240, 255, 0.2); /* Flash brighter */
        }
        55% {
          /* Bounce off: Begin return */
          width: 95vmin;
          height: 95vmin;
          border-radius: 50%;
          border-width: 2px;
          opacity: 0.4;
          border-color: rgba(6, 182, 212, 0.4);
        }
        90% {
          opacity: 0.5;
        }
        100% {
          /* Returned to center */
          width: 0;
          height: 0;
          border-radius: 50%;
          border-width: 4px;
          opacity: 0;
        }
      }

      /* Edge Refraction / Vignette Pulse */
      .edge-refraction-layer {
        position: absolute;
        inset: 0;
        box-shadow: inset 0 0 80px rgba(0,0,0,1);
        animation: edge-pulse-anim 6s ease-in-out infinite alternate;
        z-index: 1;
        mix-blend-mode: overlay;
      }

      @keyframes edge-pulse-anim {
        0% { box-shadow: inset 0 0 50px rgba(0,0,0,0.8), inset 0 0 20px rgba(6, 182, 212, 0.1); }
        100% { box-shadow: inset 0 0 150px rgba(0,0,0,1), inset 0 0 60px rgba(6, 182, 212, 0.2); }
      }

      /* --- FOOTER ANIMATIONS --- */
      @keyframes data-cycle {
        0% { 
            opacity: 0; 
            transform: scale(0.2) translateZ(-200px); 
            filter: blur(8px); 
        }
        10% { 
            opacity: 1; 
            transform: scale(1) translateZ(0); 
            filter: blur(0); 
        }
        55% { 
            opacity: 1; 
            transform: scale(1) translateZ(0) rotateY(0deg); /* Hold Static */
        }
        80% { 
            opacity: 1; /* Keep Opacity 100% during spin */
            transform: perspective(600px) rotateY(-180deg) scale(0.9); /* Spin horizontally backwards */
        }
        85% {
            opacity: 1; /* Start fading out late */
            transform: perspective(600px) rotateY(-180deg) scale(0.9);
        }
        100% { 
            opacity: 0; 
            transform: perspective(600px) rotateY(-180deg) scaleX(6) scaleY(0.05); /* Pulled apart & Fade */
            filter: blur(4px); 
        }
      }
      .animate-data-cycle {
        animation: data-cycle 5s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        transform-origin: center center;
      }

      /* --- EXISTING ANIMATIONS --- */
      @keyframes glitch-anim-1 {
        0% { clip-path: inset(20% 0 80% 0); transform: translate(-2px, 1px); }
        20% { clip-path: inset(60% 0 10% 0); transform: translate(2px, -1px); }
        40% { clip-path: inset(40% 0 50% 0); transform: translate(-2px, 2px); }
        60% { clip-path: inset(80% 0 5% 0); transform: translate(2px, -2px); }
        80% { clip-path: inset(10% 0 70% 0); transform: translate(-1px, 1px); }
        100% { clip-path: inset(30% 0 50% 0); transform: translate(1px, -1px); }
      }
      @keyframes glitch-anim-2 {
        0% { clip-path: inset(10% 0 60% 0); transform: translate(2px, -1px); }
        20% { clip-path: inset(30% 0 20% 0); transform: translate(-2px, 1px); }
        40% { clip-path: inset(70% 0 10% 0); transform: translate(2px, 2px); }
        60% { clip-path: inset(20% 0 50% 0); transform: translate(-2px, -2px); }
        80% { clip-path: inset(50% 0 30% 0); transform: translate(1px, 1px); }
        100% { clip-path: inset(0% 0 80% 0); transform: translate(-1px, -1px); }
      }
      .glitch-active { position: relative; }
      .glitch-active::before, .glitch-active::after {
        content: attr(data-text); position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #0a0a0a;
      }
      .glitch-active::before {
        left: 2px; text-shadow: -1px 0 #ff00c1; clip-path: inset(0 0 0 0); animation: glitch-anim-1 2s infinite linear alternate-reverse;
      }
      .glitch-active::after {
        left: -2px; text-shadow: -1px 0 #00fff9; clip-path: inset(0 0 0 0); animation: glitch-anim-2 3s infinite linear alternate-reverse;
      }
      
      @keyframes marquee { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
      @keyframes vertical-scroll { 0% { transform: translateY(100%); } 100% { transform: translateY(-120%); } }
      .animate-marquee { animation: marquee 30s linear infinite; }
      .animate-vertical-scroll { animation: vertical-scroll 8s linear infinite; }
      
      /* --- STAR & GALAXY EFFECTS --- */
      @keyframes twinkle-color {
        0%, 100% { opacity: 0.3; transform: scale(0.8); filter: hue-rotate(0deg); }
        50% { opacity: 1; transform: scale(1.2); filter: hue-rotate(180deg); }
      }
      .star-twinkle {
        animation: twinkle-color 5s ease-in-out infinite;
      }
      
      @keyframes spin-slow {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .animate-spin-slow {
        animation: spin-slow 120s linear infinite;
      }
      
      /* Scrollbar */
      ::-webkit-scrollbar { width: 4px; }
      ::-webkit-scrollbar-track { background: #050505; }
      ::-webkit-scrollbar-thumb { background: #333; }
      ::-webkit-scrollbar-thumb:hover { background: #555; }
    </style>
